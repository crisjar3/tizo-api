name: tizo-api

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: tizo
      POSTGRES_USER: tizo
      POSTGRES_PASSWORD: tizo-local-only
    ports:
      - "${TIZO_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tizo -d tizo"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - tizo-postgres-data:/var/lib/postgresql/data

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile
    image: tizo-api:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_FLYWAY_LOCATIONS: ${SPRING_FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/local}
      TIZO_DB_URL: ${TIZO_DB_URL:-jdbc:postgresql://postgres:5432/tizo}
      TIZO_DB_USERNAME: ${TIZO_DB_USERNAME:-tizo}
      TIZO_DB_PASSWORD: ${TIZO_DB_PASSWORD:-tizo-local-only}
      TIZO_RATE_LIMIT_ENABLED: ${TIZO_RATE_LIMIT_ENABLED:-true}
      MANAGEMENT_PORT: 8081
    ports:
      - "${TIZO_API_PORT:-8080}:8080"
      - "127.0.0.1:${TIZO_MANAGEMENT_PORT:-8081}:8081"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  tizo-postgres-data:
